name: TaskTracker CI

env:
  AZURE_WEBAPP_NAME: tasktracker-api-dev-deepti
  AZURE_WEBAPP_PACKAGE_PATH: './publish'
  DOTNET_VERSION: '9.0.x'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TaskTracker.sln

      - name: Build
        run: dotnet build TaskTracker.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TaskTracker.sln --configuration Release --no-build --verbosity normal

     - name: Publish
        run: dotnet publish src/TaskTracker.Api/TaskTracker.Api.csproj --configuration Release --output ./publish --no-build

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}